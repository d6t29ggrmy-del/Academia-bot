name: Bot Academia - reservas automaticas
 
on:
  schedule:
    - cron: "7 * * * *"   # reserva de segurança: 1x por hora (o acionamento principal vem do cron-job.org a cada 5 min)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Teste sem reservar (true/false)"
        required: false
        default: "false"
      skip_calendar:
        description: "Nao mexer no calendario (true/false)"
        required: false
        default: "false"
      notify_errors:
        description: "Avisar erro na hora pelo WhatsApp (true/false)"
        required: false
        default: "true"
 
concurrency:
  group: academia-bot
  cancel-in-progress: false
 
jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
 
      - name: Instalar dependencias
        run: pip install -r requirements.txt
 
      - name: Cache do navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
 
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
 
      - name: Rodar robo
        env:
          CA_USERNAME: ${{ secrets.CA_USERNAME }}
          CA_PASSWORD: ${{ secrets.CA_PASSWORD }}
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ANA_EMAIL: ${{ secrets.ANA_EMAIL }}
          WA_PHONE_JAIME: ${{ secrets.WA_PHONE_JAIME }}
          WA_APIKEY_JAIME: ${{ secrets.WA_APIKEY_JAIME }}
          WA_PHONE_ANA: ${{ secrets.WA_PHONE_ANA }}
          WA_APIKEY_ANA: ${{ secrets.WA_APIKEY_ANA }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_CALENDAR: ${{ github.event.inputs.skip_calendar || 'false' }}
          NOTIFY_ERRORS: ${{ github.event.inputs.notify_errors || 'false' }}
        run: python bot.py
 
      - name: Guardar prints de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-prints
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
 
